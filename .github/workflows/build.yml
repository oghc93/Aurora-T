name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Ambil dependensi native (hev-socks5-tunnel, xray, dnstt)
        run: bash scripts/fetch-deps.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK release
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleRelease 2>&1 | tee build.log

      - name: Ringkasan error
        if: failure()
        run: |
          echo "===== ERROR KOTLIN / RESOURCE ====="
          grep -nE "^e: |error:|AAPT|Execution failed|What went wrong" -A3 build.log | head -80

      - uses: actions/upload-artifact@v4
        with:
          name: CocoteTunnel-apk
          path: app/build/outputs/apk/release/*.apk
